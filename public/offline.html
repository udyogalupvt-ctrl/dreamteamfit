<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121110" />
    <title>REBUILD FITNESS — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #121110;
        color: #f3f3f3;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 16px;
        box-sizing: border-box;
      }
      main { max-width: 360px; text-align: center; }
      img { width: 96px; height: 96px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #b9b6ae; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #f5d000;
        color: #121110;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="REBUILD FITNESS" />
      <h1>No internet connection</h1>
      <p>Check the Wi-Fi or mobile data, then try again. The fingerprint machine keeps working on its own.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
